<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — InvoiceFollow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-body">

  <!-- Auth container — center aligned card -->
  <div class="auth-container">

    <!-- Logo top pe -->
    <a href="index.html" class="auth-logo">
      <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="7" fill="#4f46e5"/>
        <path d="M9 9h10M9 13h7M9 17h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="19" r="4" fill="white"/>
        <path d="M20 17.5v3M20 20.5h.01" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>InvoiceFollow</span>
    </a>

    <!-- Signup card -->
    <div class="auth-card">
      <h1>Create your account</h1>
<p class="auth-sub">Sign up free. Get 50 credits. No credit card required.</p>
      <!-- Signup form -->
      <form id="signupForm">
        <label>
          <span>Full name</span>
          <input type="text" id="signupName" placeholder="Kumar Gaurav Samrat" required />
        </label>

        <label>
          <span>Email</span>
          <input type="email" id="signupEmail" placeholder="you@example.com" required />
        </label>

        <label>
          <span>Password</span>
          <input type="password" id="signupPassword" placeholder="Minimum 6 characters" required minlength="6" />
        </label>

        <button type="submit" id="signupBtn" class="btn-primary btn-block">
          Create account
        </button>

        <p id="signupStatus" class="auth-status"></p>
      </form>

      <!-- Login link -->
      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>

  </div>

  <!-- Supabase JS library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Auth logic -->
  <script src="auth.js"></script>
  <script>
    // Signup form submit handler
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault(); // Page reload rok do

      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;
      const statusEl = document.getElementById("signupStatus");
      const btn = document.getElementById("signupBtn");

      // Validation
      if (!name || !email || !password) {
        statusEl.textContent = "Please fill in all fields.";
        statusEl.className = "auth-status error";
        return;
      }

      if (password.length < 6) {
        statusEl.textContent = "Password must be at least 6 characters.";
        statusEl.className = "auth-status error";
        return;
      }

      // Button disable karo
      btn.disabled = true;
      btn.textContent = "Creating account...";
      statusEl.textContent = "";

      try {
        // Supabase signup call
        const { data, error } = await window.supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: name }, // User metadata mein naam store karo
          },
        });

        if (error) {
          statusEl.textContent = error.message;
          statusEl.className = "auth-status error";
          btn.disabled = false;
          btn.textContent = "Create account";
          return;
        }

        // Success — user ko dashboard pe bhejo
        statusEl.textContent = "Account created! Redirecting...";
        statusEl.className = "auth-status success";

        // 1 second baad dashboard pe redirect
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
        statusEl.className = "auth-status error";
        btn.disabled = false;
        btn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
